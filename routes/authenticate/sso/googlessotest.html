<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
  function handleCredentialResponse(response) {
    const idToken = response.credential;  // This is the ID token returned by Google

    // Send this ID token to your backend for verification
    fetch('http://localhost:3000/api/google/callback', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ idToken })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        console.log('Login successful:', data.user);
      } else {
        console.log('Login failed:', data.message);
      }
    })
    .catch(err => console.error('Error:', err));
  }
</script>


<body>

  <div id="g_id_onload"
     data-client_id="502255530623-jlmts327lg660dfn4bqht8pmuim29hjk.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin" data-type="standard"></div>

  
</body>
</html>
