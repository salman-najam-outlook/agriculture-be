# config map is maintained seperately for security purpose
configMap:
  enabled: true
  depname: envfile
  name: sass-env-file
  fileLocation: /src/.env
  subPath: .env

redis:
  name: redis-server
  containerName: redis-container-pre-prod
  image: bitnami/redis:5.0.14
  resources:
    limits:
      cpu: 200m
      memory: 400Mi
    requests:
      cpu: 195m
      memory: 395Mi
  portName: redis-port
  containerPort: 6379
  env:
  - name: REDIS_DB
    value: "1"   
  - name: REDIS_HOST
    value: "redis-server" 
  - name: REDIS_PORT
    value: "6379" 
  - name: "ALLOW_EMPTY_PASSWORD"
    value: "yes"   
  
job:
  name: migration-hook-pre-prod
  containerName: migration-hook-container-pre-prod
