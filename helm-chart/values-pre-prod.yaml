deployment:
  name: dimitra-sass-pre-prod
  namespace: dimitra-sass-pre-prod
  replicaCount: 2
  containerName: dimitra-sass-pre-prod
  image: 495454422438.dkr.ecr.us-west-1.amazonaws.com/dimitra-sass-pre-prod
  portName: sass-port
  containerPort: 3000
  aloglocation: "/src/activity_log_pre-prod"
  alogname: activity-log
  pvcname: dimitra-app-pv-claim-pre-prod
  # resources:
  #   requests:
  #     memory: "4Gi"
  #     cpu: "2"
  #   limits:
  #     memory: "4Gi"
  #     cpu: "2"  
  
  PersistentVolumeClaim:
  storageClassName: gp2
  accessMode: ReadWriteMany
  capacity: 20GB

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 10%
      maxUnavailable: 10%

  livenessProbe:
    enabled: true
    httpGet:
      path: /api/logs/healthz
      port: 3000
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 30

  readinessProbe:
    enabled: true
    httpGet:
      path: /api/logs/readiness
      port: 3000
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 30

service:
  type: NodePort
  port: 3000

hpa:
  enabled: true
  name: dimitra-sass-hpa-pre-prod
  maxReplicas: 2
  minReplicas: 2
  targetCPUUtilizationPercentage: 60

