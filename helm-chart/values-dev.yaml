deployment:
  name: dimitra-sass-app-dev
  namespace: dimitra-sass-dev
  replicaCount: 1
  containerName: dimitra-sass-container-dev
  image: 495454422438.dkr.ecr.us-west-1.amazonaws.com/dimitra-saas-api-prototype-ecr-dev
  resources:
  portName: sass-port
  containerPort: 3000
  aloglocation: "/src/activity_log_development"
  alogname: activity-log
  pvcname: dimitra-app-pv-claim-dev

  PersistentVolumeClaim:
  storageClassName: gp2
  accessMode: ReadWriteMany
  capacity: 10GB


service:
  type: NodePort
  port: 3000
  nodePort: 32000

hpa:
  enabled: true
  name: dimitra-sass-hpa-dev
  maxReplicas: 20
  minReplicas: 1
  targetCPUUtilizationPercentage: 60

ingress:
  name: dimitra-sass-ingress-dev
  annotations: 
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: dimitra-dev
    alb.ingress.kubernetes.io/group.order: '50'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-1:495454422438:certificate/143a9d90-99a2-4058-a9bf-be70e0060e2a
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-1-2017-01
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
  hostName: sass-api-dev.dimitra.dev

# config map is maintained seperately for security purpose
configMap:
  enabled: true
  depname: envfile
  name: sass-env-file
  fileLocation: /src/.env
  subPath: .env

redis:
  name: redis-server
  containerName: redis-container-dev
  image: bitnami/redis:5.0.14
  resources:
    limits:
      cpu: 200m
      memory: 400Mi
    requests:
      cpu: 195m
      memory: 395Mi
  portName: redis-port
  containerPort: 6379
  env:
  - name: REDIS_DB
    value: "1"   
  - name: REDIS_HOST
    value: "redis-server" 
  - name: REDIS_PORT
    value: "6379" 
  - name: "ALLOW_EMPTY_PASSWORD"
    value: "yes"   
  
job:
  name: migration-hook-dev
  containerName: migration-hook-container-dev
