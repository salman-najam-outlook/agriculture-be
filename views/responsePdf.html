<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>
    <%= data.surveyName %> Survey Response
  </title>
  <!-- CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Lato', sans-serif;
    }

    body {
      margin: 20px;
      /* Set the margin of the body for screen viewing */
    }

    @media print {
      body {
        margin: 1in;
        /* Set the margin of the body for printing, e.g., 1 inch */
      }

      .question {
        page-break-inside: avoid;
        /* Avoid page breaks within a question */
        margin-bottom: 10px;
      }

      hr {
        margin-top: 0.5em;
        /* Reduce space before horizontal rules */
        margin-bottom: 1em;
        /* Increase space after horizontal rules */
      }
    }
  </style>
</head>

<body>
  <div id="responseDetailRows" style="padding: 16px;">
    <div style="display: flex; align-items: flex-start; margin-bottom: 16px;">
      <div style="margin-right: 16px;">
        <span><b>Survey Name:</b>
          <%= data.surveyName %>
        </span> <br />
        <span><b>Date Submitted:</b>
          <%= data.submittedDate %>
        </span> <br />
        <span><b>Farm:</b> </span>
        <%= data.farmName %> <br />
      </div>
      <!-- // render only suserSurveyResponse.scores -->
      <!-- <div style="text-align: center;">
          <small>TOTAL SCORE</small><br />
          <h3 style="font-weight: bold;">
            255
          </h3>
        </div> -->
    </div>
    <div>
      <% for(var i=0; i < data.surveyRes.length; i++) { %>
        <div style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
          ">
          <div class="question" style="
              display: flex;
              flex-direction: column;
              justify-content: space-between;
            ">
            <b>
              <%= data.surveyRes[i].question %>
            </b>
            <div>
              <%= data.surveyRes[i].answer %>
            </div>
          </div>
        </div>
        <hr style="margin-bottom: 16px;">
        </hr>
        <% } %>
    </div>
  </div>
</body>

</html>
